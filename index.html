<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         StudentSpend THEME INITIALIZER
         DARK MODE = DEFAULT
         ===================================================== -->
    <script>
      (function () {
        const theme = localStorage.getItem('StudentSpend_theme');

        if (theme === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          // Dark mode is the default
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      })();
    </script>

    <!-- =====================================================
         StudentSpend FAVICON
         ===================================================== -->
    <link
      rel="icon"
      type="image/png"
      href="/StudentSpend-logo.png"
    />

    <title>StudentSpend — Financial Intelligence</title>

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="StudentSpend — Financial Intelligence"
    />

    <meta
      property="og:description"
      content="Understand your money. Make better financial decisions."
    />

    <meta
      property="og:image"
      content="https://bolt.new/static/og_default.png"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="StudentSpend — Financial Intelligence"
    />

    <meta
      name="twitter:description"
      content="Understand your money. Make better financial decisions."
    />

    <meta
      name="twitter:image"
      content="https://bolt.new/static/og_default.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
